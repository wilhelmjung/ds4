<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2040" viewBox="0 0 1280 2040" role="img" aria-labelledby="title desc">
  <title id="title">MinerU Metal kernel fusion progress</title>
  <desc id="desc">Current Metal decoder fusion status with default fusions, opt-in QKV RoPE cache fusion, and next bottleneck targets.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#1f1f1f"/>
    </marker>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 42px; font-weight: 700; fill: #111; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 22px; font-weight: 500; fill: #444; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 31px; font-weight: 700; fill: #111; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 20px; font-weight: 500; fill: #333; }
      .tiny { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 17px; font-weight: 500; fill: #444; }
      .metric { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 24px; font-weight: 700; fill: #6f1ee8; }
      .box { rx: 9; ry: 9; stroke-width: 4; }
      .wire { stroke: #1f1f1f; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .skip { stroke: #1f1f1f; stroke-width: 4; fill: none; }
      .fusion { stroke: #9c2cf3; stroke-width: 6; stroke-dasharray: 14 14; fill: none; rx: 24; ry: 24; }
      .enabled { stroke: #16a34a; stroke-width: 5; stroke-dasharray: 0; fill: none; rx: 18; ry: 18; }
      .next { stroke: #ef4444; stroke-width: 5; stroke-dasharray: 12 10; fill: none; rx: 18; ry: 18; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="2040" fill="#fff"/>

  <text x="640" y="78" text-anchor="middle" class="title">MinerU Metal Kernel Fusion Progress</text>
  <text x="640" y="116" text-anchor="middle" class="subtitle">Default path stays stable; opt-in ICB eliminates driver-side CPU encoding and dispatch overhead.</text>

  <g transform="translate(80 146)">
    <rect x="0" y="0" width="1120" height="132" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <text x="44" y="48" class="label">Current decode dispatch picture</text>
    <text x="44" y="86" class="small">Default: 145 dispatches / token</text>
    <text x="360" y="86" class="small">ICB (Indirect Command Buffer): 1 execution command / token</text>
    <text x="960" y="86" class="metric">-144 calls</text>
  </g>

  <g transform="translate(84 332)">
    <rect x="0" y="0" width="790" height="1600" rx="30" fill="#d8e9fb"/>
    <text x="395" y="54" text-anchor="middle" class="label">Text decoder layer, repeated 24x</text>

    <rect x="274" y="96" width="242" height="78" class="box" fill="#ffffff" stroke="#111"/>
    <text x="395" y="145" text-anchor="middle" class="label">Token input</text>

    <path class="wire" d="M395 174 L395 238"/>
    <rect x="232" y="238" width="326" height="84" class="box" fill="#ffd98a" stroke="#d99a00"/>
    <text x="395" y="291" text-anchor="middle" class="label">RMSNorm</text>

    <path class="wire" d="M395 322 L395 388"/>
    <rect x="118" y="388" width="554" height="98" class="box" fill="#fff01f" stroke="#d7c400"/>
    <text x="395" y="429" text-anchor="middle" class="label">QKV projection</text>
    <text x="395" y="462" text-anchor="middle" class="small">Direction 2: fused by default</text>
    <rect x="96" y="366" width="598" height="140" class="enabled"/>

    <path class="wire" d="M288 486 C288 550 260 548 260 610"/>
    <path class="wire" d="M395 486 L395 610"/>
    <path class="wire" d="M502 486 C502 550 530 548 530 610"/>
    <text x="253" y="592" text-anchor="middle" class="small">Q</text>
    <text x="395" y="592" text-anchor="middle" class="small">K</text>
    <text x="536" y="592" text-anchor="middle" class="small">V</text>

    <rect x="150" y="610" width="490" height="78" class="box" fill="#fef9c3" stroke="#d6c944"/>
    <text x="395" y="641" text-anchor="middle" class="label">RoPE + KV-cache</text>
    <text x="395" y="670" text-anchor="middle" class="small">Opt-in: fused with QKV projection</text>
    <rect x="78" y="350" width="634" height="360" class="fusion"/>

    <path class="wire" d="M395 688 L395 760"/>
    <rect x="118" y="760" width="554" height="108" class="box" fill="#fff01f" stroke="#d7c400"/>
    <text x="395" y="802" text-anchor="middle" class="label">Grouped Query Attention</text>
    <text x="395" y="835" text-anchor="middle" class="small">still many dispatches; next target</text>
    <rect x="96" y="738" width="598" height="150" class="next"/>

    <path class="wire" d="M395 868 L395 934"/>
    <circle cx="395" cy="960" r="34" fill="#fff" stroke="#111" stroke-width="4"/>
    <text x="395" y="971" text-anchor="middle" font-size="58" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#111">+</text>
    <path class="skip" d="M148 132 C56 132 56 960 361 960"/>

    <path class="wire" d="M395 994 L395 1058"/>
    <rect x="190" y="1058" width="410" height="92" class="box" fill="#b8a8ff" stroke="#6f55e8"/>
    <text x="395" y="1094" text-anchor="middle" class="label">O projection</text>
    <text x="395" y="1124" text-anchor="middle" class="small">+ attention residual</text>
    <rect x="168" y="1036" width="454" height="136" class="enabled"/>

    <path class="wire" d="M395 1150 L395 1220"/>
    <rect x="232" y="1220" width="326" height="84" class="box" fill="#ffd98a" stroke="#d99a00"/>
    <text x="395" y="1273" text-anchor="middle" class="label">RMSNorm</text>

    <path class="wire" d="M395 1304 L395 1370"/>
    <rect x="172" y="1370" width="446" height="96" class="box" fill="#b8a8ff" stroke="#6f55e8"/>
    <text x="395" y="1410" text-anchor="middle" class="label">MLP / SwiGLU</text>
    <text x="395" y="1440" text-anchor="middle" class="small">fused by default for prefill</text>
    <rect x="150" y="1348" width="490" height="140" class="enabled"/>

    <path class="wire" d="M395 1466 L395 1530"/>
    <circle cx="395" cy="1556" r="34" fill="#fff" stroke="#111" stroke-width="4"/>
    <text x="395" y="1567" text-anchor="middle" font-size="58" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#111">+</text>
    <path class="skip" d="M118 960 C30 960 30 1556 361 1556"/>
  </g>

  <g transform="translate(916 390)">
    <rect x="0" y="0" width="280" height="890" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <text x="24" y="48" class="label">Legend</text>

    <rect x="28" y="84" width="64" height="44" class="enabled"/>
    <text x="112" y="113" class="small">enabled default</text>

    <rect x="28" y="162" width="64" height="44" class="fusion"/>
    <text x="112" y="190" class="small">opt-in only</text>

    <rect x="28" y="240" width="64" height="44" class="next"/>
    <text x="112" y="268" class="small">next bottleneck</text>

    <text x="24" y="336" class="small">Enabled now</text>
    <text x="24" y="366" class="tiny">Vision QKV fusion</text>
    <text x="24" y="396" class="tiny">Text QKV projection fusion</text>
    <text x="24" y="426" class="tiny">O projection + residual add</text>
    <text x="24" y="456" class="tiny">FFN/SwiGLU prefill fusion</text>
    <text x="24" y="486" class="tiny">FlashAttention Occupancy Tuning</text>
    <text x="24" y="516" class="tiny">Text Prefill FlashAttn Tuning</text>

    <text x="24" y="566" class="small">Opt-in result</text>
    <text x="24" y="596" class="tiny">Dispatches: 145 -> 121/token</text>
    <text x="24" y="626" class="tiny">Correctness: exact</text>
    <text x="24" y="656" class="tiny">Default unchanged: E2E slower</text>

    <text x="24" y="696" class="small">BF16 KV-Cache (Opt-in)</text>
    <text x="24" y="726" class="tiny">Speedup: ~8.8% E2E faster</text>
    <text x="24" y="756" class="tiny">Correctness: exact parity</text>

    <text x="24" y="806" class="small">Decoder ICB (Opt-in)</text>
    <text x="24" y="836" class="tiny">MU_TEXT_DECODE_ICB=1</text>
    <text x="24" y="866" class="tiny">Speedup: ~3.0% decode speedup</text>
  </g>

  <g transform="translate(916 1320)">
    <rect x="0" y="0" width="280" height="320" rx="22" fill="#fff7ed" stroke="#fed7aa" stroke-width="3"/>
    <text x="24" y="48" class="label">Next work</text>
    <text x="24" y="94" class="small">Pre-recorded Loops</text>
    <text x="24" y="132" class="tiny">ICB is fully implemented.</text>
    <text x="24" y="158" class="tiny">Next: verify dynamic shapes</text>
    <text x="24" y="218" class="small">Decoder optimization</text>
    <text x="24" y="256" class="tiny">Pre-record multi-page paths</text>
    <text x="24" y="282" class="tiny">or profile vision tower SDPA.</text>
  </g>

  <text x="640" y="1988" text-anchor="middle" class="subtitle">Status: correctness exact, decoder ICB eliminates dispatch loops, custom MSL remains default.</text>
</svg>
