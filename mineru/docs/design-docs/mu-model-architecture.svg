<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">MinerU mu model architecture</title>
  <desc id="desc">Qwen2-VL model architecture and current Metal execution paths.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .band { fill: #ffffff; stroke: #ccd3df; stroke-width: 1.4; }
      .box { fill: #fdfefe; stroke: #253044; stroke-width: 1.5; rx: 8; }
      .cpu { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.2; rx: 8; }
      .gpu { fill: #dcfce7; stroke: #15803d; stroke-width: 2.2; rx: 8; }
      .default { fill: #bbf7d0; stroke: #166534; stroke-width: 2.4; rx: 8; }
      .diag { fill: #ffedd5; stroke: #c2410c; stroke-width: 2.2; rx: 8; }
      .legendCpu { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.6; rx: 6; }
      .legendGpu { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; rx: 6; }
      .text { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .head { font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 700; fill: #111827; }
      .label { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; font-weight: 600; }
      .arrow { stroke: #5b6678; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #9b6b00; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrowDiag); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6678" />
    </marker>
    <marker id="arrowDiag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9b6b00" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="860" />
  <text class="head" x="50" y="45">MinerU mu Model Architecture</text>
  <text class="small" x="50" y="70">Qwen2-VL-1.2B native C/Metal path. Blue is CPU-side orchestration; green is GPU compute.</text>

  <rect class="legendCpu" x="865" y="28" width="110" height="34" />
  <text class="label" x="892" y="50">CPU</text>
  <rect class="legendGpu" x="995" y="28" width="110" height="34" />
  <text class="label" x="1022" y="50">GPU</text>
  <rect class="diag" x="1125" y="28" width="110" height="34" />
  <text class="label" x="1143" y="50">DIAGNOSTIC</text>

  <rect class="band" x="40" y="105" width="270" height="675" rx="10" />
  <text class="head" x="65" y="140">Input Processing</text>

  <rect class="cpu" x="70" y="170" width="210" height="58" />
  <text class="text" x="100" y="195">Raw RGB Image</text>
  <text class="small" x="100" y="214">page or crop</text>

  <rect class="cpu" x="70" y="270" width="210" height="64" />
  <text class="text" x="96" y="296">Resize / Pad</text>
  <text class="small" x="93" y="316">Normalize on CPU</text>

  <rect class="cpu" x="70" y="376" width="210" height="64" />
  <text class="text" x="95" y="402">Spatial Patches</text>
  <text class="small" x="94" y="422">14x14, temporal 2</text>

  <rect class="gpu" x="70" y="482" width="210" height="70" />
  <text class="text" x="91" y="509">Patch Embedding</text>
  <text class="small" x="84" y="529">3D conv projection</text>
  <text class="small" x="111" y="546">to 1280</text>

  <path class="arrow" d="M175 228 V270" />
  <path class="arrow" d="M175 334 V376" />
  <path class="arrow" d="M175 440 V482" />

  <rect class="band" x="350" y="105" width="410" height="675" rx="10" />
  <text class="head" x="375" y="140">Vision Tower</text>
  <text class="small" x="375" y="162">32 ViT blocks, 1280 hidden, 16 heads</text>

  <rect class="gpu" x="455" y="190" width="200" height="58" />
  <text class="text" x="505" y="216">3D M-RoPE</text>
  <text class="small" x="482" y="235">layout-aware position</text>

  <rect class="gpu" x="430" y="290" width="250" height="72" />
  <text class="text" x="466" y="318">LayerNorm + QKV</text>
  <text class="small" x="455" y="339">fused projection path</text>

  <rect class="default" x="405" y="420" width="300" height="84" />
  <text class="label" x="423" y="445">DEFAULT</text>
  <text class="text" x="466" y="470">MPSGraph SDPA</text>
  <text class="small" x="442" y="490">Q/K/V packed as 1x16xrowsx80</text>

  <rect class="diag" x="405" y="565" width="300" height="86" />
  <text class="label" x="423" y="590">DIAGNOSTIC ONLY</text>
  <text class="text" x="455" y="615">MSL attention lanes</text>
  <text class="small" x="443" y="635">flash, K16, packed rows=5476</text>

  <rect class="gpu" x="445" y="705" width="220" height="54" />
  <text class="text" x="484" y="730">Projection + FFN</text>
  <text class="small" x="480" y="748">residual paths</text>

  <path class="arrow" d="M280 517 H350 C395 517 405 219 455 219" />
  <path class="arrow" d="M555 248 V290" />
  <path class="arrow" d="M555 362 V420" />
  <path class="dash" d="M555 504 V565" />
  <path class="arrow" d="M555 504 V705" />
  <path class="dash" d="M555 651 V705" />

  <rect class="band" x="800" y="105" width="190" height="675" rx="10" />
  <text class="head" x="825" y="140">Spatial Merger</text>

  <rect class="gpu" x="825" y="320" width="140" height="70" />
  <text class="text" x="857" y="346">2x2 Merge</text>
  <text class="small" x="840" y="366">spatial pooling</text>

  <rect class="gpu" x="825" y="455" width="140" height="76" />
  <text class="text" x="837" y="481">Project 1280</text>
  <text class="small" x="869" y="501">to 896</text>
  <text class="small" x="850" y="519">decoder width</text>

  <path class="arrow" d="M665 732 H745 C785 732 795 355 825 355" />
  <path class="arrow" d="M895 390 V455" />

  <rect class="band" x="1030" y="105" width="210" height="675" rx="10" />
  <text class="head" x="1055" y="140">Text Decoder</text>
  <text class="small" x="1055" y="162">24 Qwen2 layers, 896 hidden</text>

  <rect class="gpu" x="1055" y="215" width="160" height="70" />
  <text class="text" x="1073" y="241">Embedding Scatter</text>
  <text class="small" x="1079" y="261">visual + prompt</text>

  <rect class="gpu" x="1055" y="340" width="160" height="74" />
  <text class="text" x="1081" y="366">Resident Decode</text>
  <text class="small" x="1076" y="386">one command buffer</text>
  <text class="small" x="1104" y="404">per token</text>

  <rect class="default" x="1055" y="470" width="160" height="72" />
  <text class="label" x="1073" y="494">DEFAULT</text>
  <text class="text" x="1078" y="517">cached attention</text>
  <text class="small" x="1105" y="536">SIMD</text>

  <rect class="default" x="1055" y="595" width="160" height="70" />
  <text class="label" x="1073" y="619">DEFAULT</text>
  <text class="text" x="1084" y="642">fused SwiGLU</text>

  <rect class="gpu" x="1055" y="710" width="160" height="50" />
  <text class="text" x="1080" y="740">Greedy Output</text>

  <path class="arrow" d="M965 493 H1010 C1030 493 1035 250 1055 250" />
  <path class="arrow" d="M1135 285 V340" />
  <path class="arrow" d="M1135 414 V470" />
  <path class="arrow" d="M1135 542 V595" />
  <path class="arrow" d="M1135 665 V710" />

  <rect class="cpu" x="1025" y="795" width="205" height="42" />
  <text class="small" x="1050" y="821">CPU postprocess outside graph</text>
</svg>
